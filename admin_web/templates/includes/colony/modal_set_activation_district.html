
{% load i18n %}
{% load static %}

<div class="modal modal-default fade" id="modal-set-activation-district-{{district.id}}" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">{% trans "Définir l'activité des bâtiments ?"%}</h4>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
          </button>
        </div>

        <form id="api_form_district_set_activation_percent_{{district.id}}" method="POST" data-api-url="api_district_set_activation_percent">
          {% csrf_token %}

            <input type="hidden" name="server" value="{{server_name}}" />
            <input type="hidden" name="colony_id" value="{{colony_id}}" />
            <input type="hidden" name="district_id" value="{{ district.id }}">

            <div class="modal-body modal-media">
              <img src="{% static ""%}{{district.illustration}}" alt="">
              <div>
                <b class="u-font-size-2em"><i class="fas {{district.icon}}"></i>  {{district.name}}</b>
                <p class="u-font-size-1-1em mb-2">{% trans "Le taux d'activité sera appliqué à tous les bâtiments appartenant au district."%}</p>
                <input id="{{district.id}}_activation_percent" class="js-range-slider" type="text" name="activation_percent" value="">
              </div>
            </div>


            <div class="modal-footer justify-content-between">
                <button type="button" class="btn btn-outline-light btn-default" data-dismiss="modal">{% trans "Annuler"%}</button>
                <button type="submit" class="btn btn-outline-light">{% trans "Appliquer"%}</button>
            </div>

          </form>


      </div>
      <!-- /.modal-content -->

    </div>
    <!-- /.modal-dialog -->
</div>
