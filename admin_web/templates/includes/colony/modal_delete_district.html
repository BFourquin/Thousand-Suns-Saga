
{% load i18n %}
{% load static %}

<div class="modal modal-danger fade u-display-none" id="modal-delete-district-{{district.id}}" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content bg-danger">
        <div class="modal-header">
          <h4 class="modal-title">{% trans "Détruire ce district ?"%}</h4>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
          </button>
        </div>

        <form id="api_form_delete_district_{{district.id}}" method="POST" data-api-url="api_delete_district">
          {% csrf_token %}

            <input type="hidden" id="server" name="server" value={{server_name}} />
            <input type="hidden" id="colony_id" name="colony_id" value={{colony_id}} />
            <input type="hidden" name="district_id" value="{{ district.id }}">

            <div class="modal-body">
              <table class="table table-stripped u-width-100pct-table-layout-auto-tbody-tr-style"white-space: nowrap;">
                      <td class="u-width-0-border-none">
                        <img src="{% static ""%}{{district.illustration}}" class="u-max-height-10em-margin-bottom-0-75em"></td>

                      <td class="u-font-size-20px-text-align-center-vertical-align-middle-border-none">
                        <b class="u-font-size-2em"><i class="fas {{district.icon}}"></i>  {{district.name}}</b>
                        <br>
                        <span class="u-font-size-1-1em">{% trans "Le district et l'ensemble de ses bâtiments seront détruits, mais une partie des ressources pourront être recyclées."%}</span>
                    </td>
                  </tbody>
              </table>

            </div>


            <div class="modal-footer justify-content-between">
                <button type="button" class="btn btn-outline-light btn-default" data-dismiss="modal">{% trans "Annuler"%}</button>
                <button type="submit" class="btn btn-outline-light">{% trans "Détruire"%}</button>
            </div>

          </form>


      </div>
      <!-- /.modal-content -->

    </div>
    <!-- /.modal-dialog -->
</div>
