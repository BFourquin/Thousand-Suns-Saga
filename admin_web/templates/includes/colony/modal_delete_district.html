
{% load i18n %}
{% load static %}

<div class="modal modal-danger fade" id="modal-delete-district-{{district.id}}" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content bg-danger">
        <div class="modal-header">
          <h4 class="modal-title">{% trans "Détruire ce district ?"%}</h4>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
          </button>
        </div>

        <form id="api_form_delete_district_{{district.id}}" method="POST" data-api-url="api_delete_district">
          {% csrf_token %}

            <input type="hidden" name="server" value="{{server_name}}" />
            <input type="hidden" name="colony_id" value="{{colony_id}}" />
            <input type="hidden" name="district_id" value="{{ district.id }}">

            <div class="modal-body modal-media">
              <img src="{% static ""%}{{district.illustration}}" alt="">
              <div>
                <b class="u-font-size-2em"><i class="fas {{district.icon}}"></i>  {{district.name}}</b>
                <p class="u-font-size-1-1em mb-2">{% trans "Le district et l'ensemble de ses bâtiments seront détruits, mais une partie des ressources pourront être recyclées."%}</p>
              </div>
            </div>


            <div class="modal-footer justify-content-between">
                <button type="button" class="btn btn-outline-light btn-default" data-dismiss="modal">{% trans "Annuler"%}</button>
                <button type="submit" class="btn btn-outline-light">{% trans "Détruire"%}</button>
            </div>

          </form>


      </div>
      <!-- /.modal-content -->

    </div>
    <!-- /.modal-dialog -->
</div>
