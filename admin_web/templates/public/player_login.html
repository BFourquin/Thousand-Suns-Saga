
{% load static %}
{% load i18n %}

{% include "includes/head.html" with title="TSS Login" %}


<body class="login-page dark-mode">


<div class="login-box">
  <div class="card card-outline card-primary">
    <div class="card-header text-center">
      <img src="{% static "images/logo/TSS-logo-white.png" %}" class="login-logo-image" alt="" />
      <a href="/public_homepage/" class="login-title">THOUSAND SUNS SAGA</a>
    </div>
    <div class="card-body">
      <p class="login-box-msg">{% trans "Connexion à votre compte utilisateur" %}</p>

      {% if login_error %}<div class="alert alert-danger">{{ login_error }}</div>{% endif %}

      <form action="/player_login/" method="post">
        {% csrf_token %}

        <div class="input-group mb-3">
          <input name="username" type="text" class="form-control" placeholder="{% trans 'Utilisateur' %}" aria-label="{% trans 'Utilisateur' %}" autocomplete="username" required autofocus>
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-user"></span>
            </div>
          </div>
        </div>
        <div class="input-group mb-3">
          <input name="password" type="password" class="form-control" placeholder="{% trans 'Mot de passe' %}" aria-label="{% trans 'Mot de passe' %}" autocomplete="current-password" required>
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-lock"></span>
            </div>
          </div>
        </div>

        <div class="text-center mt-2 mb-3">
            <button type="submit" class="btn btn-primary btn-block">{% trans "Connexion" %}</button>
        </div>
      </form>

      <p class="mb-0 text-center">
        <a href="/player_register/">{% trans "Créer un compte utilisateur" %}</a>
      </p>
    </div>
    <!-- /.card-body -->
  </div>
  <!-- /.card -->
</div>
<!-- /.login-box -->

</body>
</html>
